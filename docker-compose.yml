version:  '3.1'

services:
  db:
    image: postgres:latest
    container_name: PostgreSQL-FuelTracker
    restart: always
    environment:
      POSTGRES_DB: fuelTracker
      POSTGRES_USER: fuelTracker
      POSTGRES_PASSWORD: fuelTracker
    ports:
      - "5432:5432"
    volumes:
      - /Users/dawid/Docker volumes/PostgreSQL:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: Redis-fuelTracker
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --save
      - 60 1

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped